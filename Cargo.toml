[package]
name = "bulb-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }
# Pinned to the version tokio-cron-scheduler already depends on, so the
# build has a single `Tz` type and it satisfies `Job::new_async_tz`.
chrono-tz = "0.10"
tokio-cron-scheduler = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1"] }
deadpool-postgres = "0.14.1"
dotenvy = "0.15.7"
refinery = { version = "0.9", features = ["tokio-postgres"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
utoipa-axum = "0.2"
